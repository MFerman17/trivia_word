# Memoria para compilar Android. La plantilla de Flutter trae -Xmx8G, que en
# un PC de 8 GB de RAM agota la memoria y Gradle se cierra ("daemon
# disappeared"). Con estos valores compila bien dejando sitio a VS Code y Chrome.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# El compilador de Kotlin corre en otro proceso: también con un límite.
kotlin.daemon.jvmargs=-Xmx1024m
# Compilar los paquetes de uno en uno gasta menos memoria (algo más lento).
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
